services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alma
      POSTGRES_PASSWORD: alma_dev_password
      POSTGRES_DB: alma_evaluation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: alma-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: